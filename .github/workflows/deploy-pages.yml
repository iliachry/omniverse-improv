name: Deploy 3D Studio & SDG Demo to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies & Build Stages
        run: |
          pip install -r requirements.txt
          python usd_generators/generate_physics_playground.py
          python usd_generators/generate_procedural_scene.py
          python usd_generators/generate_robotics_arm.py
          python usd_generators/generate_block_tower.py
          python replicator/generate_synthetic_dataset_standalone.py
          python usd_viewer/export_static_demo.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
