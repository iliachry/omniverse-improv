name: CI / USD Validation & Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  PYTHONPATH: "."

jobs:
  test:
    name: Pytest & USD Generators (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Generate Kinetic Physics Playground
        run: python usd_generators/generate_physics_playground.py

      - name: Generate Procedural Sci-Fi Scene
        run: python usd_generators/generate_procedural_scene.py

      - name: Generate 6-DOF Robotics Arm
        run: python usd_generators/generate_robotics_arm.py

      - name: Generate Destructible Block Tower
        run: python usd_generators/generate_block_tower.py

      - name: Generate Industrial Warehouse Digital Twin
        run: python usd_generators/generate_warehouse_digital_twin.py

      - name: Generate Prompt-to-USD Stage
        run: python usd_generators/prompt_to_usd.py

      - name: Run 6-DOF Inverse Kinematics (IK) Solver
        run: python robotics/ik_solver.py

      - name: Run Synthetic Data Generation (SDG) Pipeline
        run: python replicator/generate_synthetic_dataset_standalone.py

      - name: Export YOLOv8 & COCO Synthetic Datasets
        run: python replicator/export_coco_yolo.py

      - name: Run Pytest Test Suite
        run: pytest tests/ -v
